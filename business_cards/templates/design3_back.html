<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
html, body {
  width: 1004px;
  height: 650px;
  overflow: hidden;
  background: transparent;
  font-family: 'Plus Jakarta Sans', sans-serif;
}
@page {
  size: 85mm 55mm;
  margin: 0;
}
.card {
  width: 1004px;
  height: 650px;
  position: relative;
  overflow: hidden;
}
.serif { font-family: 'Cormorant Garamond', Georgia, serif; }
.sans { font-family: 'Plus Jakarta Sans', sans-serif; }

.card {
  background: #232A20;
  color: #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 40px 52px;
  position: relative;
}
.border-gold {
  position: absolute;
  top: 18px; left: 18px; right: 18px; bottom: 18px;
  border: 1px solid rgba(197, 168, 128, 0.35);
  border-radius: 12px;
  pointer-events: none;
}
.left-col {
  flex: 1;
  max-width: 530px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 16px;
  z-index: 2;
}
.heading-name {
  font-size: 34px;
  font-weight: 500;
  color: #F8F5EE;
  letter-spacing: 0.04em;
}
.heading-sub {
  font-size: 11.5px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #C5A880;
  font-weight: 600;
  margin-top: 4px;
}
.services-box {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(197, 168, 128, 0.25);
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 12px;
  color: #E2DDD5;
  line-height: 1.5;
}
.contact-items {
  display: flex;
  flex-direction: column;
  gap: 11px;
}
.c-item {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 14.5px;
  color: #E2DDD5;
}
.c-item strong {
  color: #FFFFFF;
  font-size: 15px;
}
.c-box {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(197, 168, 128, 0.15);
  border: 1px solid rgba(197, 168, 128, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #C5A880;
}
.c-icon {
  width: 16px;
  height: 16px;
}
.right-col {
  width: 290px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-left: 1px solid rgba(197, 168, 128, 0.25);
  padding-left: 45px;
  z-index: 2;
}
.white-qr-card {
  background: #FFFFFF;
  padding: 16px;
  border-radius: 20px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  text-align: center;
}
.white-qr-card img {
  width: 155px;
  height: 155px;
  display: block;
}
.qr-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #232A20;
  margin-top: 10px;
}
.hours-tag {
  margin-top: 14px;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: #C5A880;
  text-align: center;
}
</style>
</head>
<body>
<div class="card">
  <div class="border-gold"></div>

  <div class="left-col">
    <div>
      <div class="heading-name serif">Яна Кърнолска</div>
      <div class="heading-sub sans">Психологически консултации</div>
    </div>

    <div class="services-box sans">
      &bull; Психолог &bull; Спортен психолог<br>
      &bull; Организационен и социален психолог
    </div>

    <div class="contact-items sans">
      <div class="c-item">
        <div class="c-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="contact-icon"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></div>
        <span><strong>+359 887 344 424</strong></span>
      </div>
      <div class="c-item">
        <div class="c-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="contact-icon"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div>
        <span>yanakarnolska@gmail.com</span>
      </div>
      <div class="c-item">
        <div class="c-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="contact-icon"><path d="M12 21s-6-5.333-6-10a6 6 0 0 1 12 0c0 4.667-6 10-6 10z"/><circle cx="12" cy="11" r="2.5"/></svg></div>
        <span>гр. София, ул. „Оборище“ 42 &bull; Онлайн</span>
      </div>
      <div class="c-item">
        <div class="c-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="contact-icon"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></div>
        <span>yanapsychology.com</span>
      </div>
    </div>
  </div>

  <div class="right-col">
    <div class="white-qr-card">
      <img src="../assets/qr_code.svg" alt="QR Code" />
      <div class="qr-title sans">ЗАПАЗЕТЕ ЧАС</div>
    </div>
    <div class="hours-tag sans">Пон – Пет: 09:00 – 19:00 ч.</div>
  </div>
</div>
</body>
</html>
