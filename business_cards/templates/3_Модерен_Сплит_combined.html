<style>


* { margin: 0; padding: 0; box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
html, body {
  width: 1004px;
  height: 650px;
  overflow: hidden;
  background: transparent;
  font-family: 'Plus Jakarta Sans', sans-serif;
}
@page {
  size: 85mm 55mm;
  margin: 0;
}
.card {
  width: 1004px;
  height: 650px;
  position: relative;
  overflow: hidden;
}
.serif { font-family: 'Cormorant Garamond', Georgia, serif; }
.sans { font-family: 'Plus Jakarta Sans', sans-serif; }

.card {
  display: flex;
  align-items: stretch;
  background: #252D21;
  position: relative;
}
.left-split {
  width: 430px;
  background: linear-gradient(135deg, #F9F6F0 0%, #EFEAE0 100%);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.owner-cutout {
  width: 390px;
  height: 590px;
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  object-fit: contain;
  object-position: bottom center;
  filter: drop-shadow(0 15px 25px rgba(0,0,0,0.25));
}
.split-badge {
  position: absolute;
  top: 30px;
  left: 30px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 10px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: #384233;
  font-weight: 600;
  border: 1px solid rgba(197, 168, 128, 0.4);
}
.right-split {
  flex: 1;
  padding: 60px 55px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  color: #FFFFFF;
  position: relative;
}
.monogram-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.monogram-text {
  font-size: 38px;
  letter-spacing: -2px;
  color: #C5A880;
  line-height: 1;
}
.city-tag {
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
}
.main-title-block {
  margin: 30px 0;
}
.name-line1 {
  font-size: 48px;
  font-weight: 400;
  line-height: 1;
  color: #F8F5EE;
  letter-spacing: 0.02em;
}
.name-line2 {
  font-size: 58px;
  font-weight: 500;
  line-height: 1.05;
  color: #FFFFFF;
  letter-spacing: 0.02em;
}
.role-badge {
  margin-top: 14px;
  font-size: 13px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: #C5A880;
  font-weight: 600;
}
.footer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid rgba(197, 168, 128, 0.3);
  padding-top: 18px;
}
.footer-quote {
  font-size: 17px;
  font-style: italic;
  color: #D3CDC4;
}
.footer-web {
  font-size: 12px;
  letter-spacing: 0.15em;
  color: #C5A880;
  font-weight: 500;
}
