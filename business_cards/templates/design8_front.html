<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
html, body {
  width: 1004px;
  height: 650px;
  overflow: hidden;
  background: transparent;
  font-family: 'Plus Jakarta Sans', sans-serif;
}
@page {
  size: 85mm 55mm;
  margin: 0;
}
.card {
  width: 1004px;
  height: 650px;
  position: relative;
  overflow: hidden;
}
.serif { font-family: 'Cormorant Garamond', Georgia, serif; }
.sans { font-family: 'Plus Jakarta Sans', sans-serif; }

.card {
  background: #171B15;
  color: #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 40px 52px;
  position: relative;
}
.left-col {
  flex: 1;
  max-width: 530px;
  z-index: 2;
}
.top-monogram {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.monogram-sq {
  width: 44px;
  height: 44px;
  border-radius: 8px;
  background: rgba(197, 168, 128, 0.15);
  border: 1px solid #C5A880;
  color: #F8F5EE;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
}
.sq-label {
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #C5A880;
  font-weight: 600;
}
.name {
  font-size: 52px;
  font-weight: 500;
  line-height: 1.05;
  color: #FFFFFF;
  letter-spacing: 0.02em;
  margin-bottom: 16px;
}
.roles-stack {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 24px;
}
.r-badge {
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #D6BD96;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.r-badge::before {
  content: "";
  display: inline-block;
  width: 14px;
  height: 1.5px;
  background: #C5A880;
}
.bottom-url {
  font-size: 13px;
  letter-spacing: 0.18em;
  color: #A39D93;
}
.right-col {
  z-index: 2;
}
.portrait-round {
  width: 320px;
  height: 440px;
  border-radius: 160px;
  border: 2px solid #C5A880;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  background: #EAE5DB;
}
.portrait-round img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 8%;
}
</style>
</head>
<body>
<div class="card">
  <div class="left-col">
    <div class="top-monogram">
      <div class="monogram-sq serif">ЯК</div>
      <div class="sq-label sans">ПСИХОЛОГИЧЕСКА ПРАКТИКА</div>
    </div>
    <div class="name serif">Яна Кърнолска</div>
    <div class="roles-stack sans">
      <div class="r-badge">Психолог</div>
      <div class="r-badge">Спортен психолог</div>
      <div class="r-badge">Организационен и социален психолог</div>
    </div>
    <div class="bottom-url sans">yanapsychology.com &bull; София &bull; Онлайн</div>
  </div>
  <div class="right-col">
    <div class="portrait-round">
      <img src="../assets/owner.png" alt="Яна Кърнолска" />
    </div>
  </div>
</div>
</body>
</html>
