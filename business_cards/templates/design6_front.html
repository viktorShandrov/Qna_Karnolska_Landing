<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
html, body {
  width: 1004px;
  height: 650px;
  overflow: hidden;
  background: transparent;
  font-family: 'Plus Jakarta Sans', sans-serif;
}
@page {
  size: 85mm 55mm;
  margin: 0;
}
.card {
  width: 1004px;
  height: 650px;
  position: relative;
  overflow: hidden;
}
.serif { font-family: 'Cormorant Garamond', Georgia, serif; }
.sans { font-family: 'Plus Jakarta Sans', sans-serif; }

.card {
  background: #F7F4EE;
  color: #262422;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 40px 52px;
  position: relative;
}
.frame-outer {
  position: absolute;
  top: 16px; left: 16px; right: 16px; bottom: 16px;
  border: 1px solid #C5A880;
  border-radius: 12px;
  pointer-events: none;
}
.frame-inner {
  position: absolute;
  top: 22px; left: 22px; right: 22px; bottom: 22px;
  border: 1px solid rgba(197, 168, 128, 0.35);
  border-radius: 8px;
  pointer-events: none;
}
.left-col {
  flex: 1;
  max-width: 530px;
  z-index: 2;
}
.monogram-line {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.monogram-box {
  font-size: 32px;
  color: #4A5445;
  line-height: 1;
}
.tag-line {
  font-size: 11px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: #8C7355;
  font-weight: 600;
}
.name {
  font-size: 52px;
  font-weight: 500;
  line-height: 1.05;
  color: #1F1D1B;
  margin-bottom: 16px;
  letter-spacing: 0.02em;
}
.triad-roles {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 22px;
}
.t-role {
  font-size: 12px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: #556050;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.t-role span {
  color: #C5A880;
  font-size: 10px;
}
.slogan {
  font-size: 20px;
  font-style: italic;
  color: #635F59;
}
.right-col {
  z-index: 2;
}
.arch-window {
  width: 310px;
  height: 440px;
  border-radius: 155px 155px 16px 16px;
  border: 2px solid #C5A880;
  overflow: hidden;
  box-shadow: 0 16px 40px rgba(74, 84, 69, 0.18);
  background: #EAE5DB;
}
.arch-window img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 8%;
}
</style>
</head>
<body>
<div class="card">
  <div class="frame-outer"></div>
  <div class="frame-inner"></div>
  <div class="left-col">
    <div class="monogram-line">
      <div class="monogram-box serif">ЯК</div>
      <div class="tag-line sans">Психологически консултации</div>
    </div>
    <div class="name serif">Яна Кърнолска</div>
    <div class="triad-roles sans">
      <div class="t-role"><span>♦</span> Психолог</div>
      <div class="t-role"><span>♦</span> Спортен психолог</div>
      <div class="t-role"><span>♦</span> Организационен и социален психолог</div>
    </div>
    <div class="slogan serif">„Подкрепа. Разбиране. Промяна.“</div>
  </div>
  <div class="right-col">
    <div class="arch-window">
      <img src="../assets/owner.png" alt="Яна Кърнолска" />
    </div>
  </div>
</div>
</body>
</html>
